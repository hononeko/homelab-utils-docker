name: Image

# Builds one image natively on an amd64 and an arm64 runner (no QEMU), checks each one starts, and, with `push`,
# pushes each to GHCR by digest. cd.yml combines the digests into one multi-arch image.
on:
  workflow_call:
    inputs:
      image:
        description: The image to build, a directory under images/
        type: string
        required: true
      push:
        description: Push each architecture's image to GHCR by digest and upload the digests as artifacts
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # What both callers grant: read the code, push images when `push` is set.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: hononeko/actions/build-image@v1
        with:
          context: ./images/${{ inputs.image }}
          platforms: linux/${{ matrix.arch }}
          tags: check:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.arch }}

      # The images are tools, not servers: check the entrypoint starts and runs a command.
      - name: Check the image runs
        env:
          IMAGE: check:${{ matrix.arch }}
        run: docker run --rm "$IMAGE" sh -c 'echo ok'

      - name: Log in to GitHub Container Registry (GHCR)
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        if: inputs.push
        uses: hononeko/actions/build-image@v1
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image }}
          context: ./images/${{ inputs.image }}
          platforms: linux/${{ matrix.arch }}
          push: "true"
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          digest-artifact: digests-${{ matrix.arch }}
