name: Validate Images (CI)

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows and actions
        uses: hononeko/actions/lint-actions@v1

      - name: Lint Dockerfiles
        uses: hononeko/actions/lint-docker@v1

  # Every image on both architectures, built and checked; nothing is pushed.
  image:
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [k8s-backup-tools, k8s-config-tools]
    uses: ./.github/workflows/image.yml
    with:
      image: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
