name: Release

# Releases one image: its next version from the Conventional Commits under images/<image> since its last
# <image>-X.Y.Z tag, both architectures built and joined into one multi-arch image tagged with that version and
# `latest` (with build provenance), and a GitHub Release with that image's notes.
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: The image to release
        required: true
        type: choice
        options:
          - k8s-backup-tools
          - k8s-config-tools

# Never cancel a release mid-flight; a second dispatch for the same image waits.
concurrency:
  group: release-${{ inputs.image_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version-tag }}
      version_type: ${{ steps.version.outputs.version-type }}
      previous_tag: ${{ steps.version.outputs.previous-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Version
        id: version
        uses: hononeko/actions/version@v1
        with:
          tag-prefix: ${{ inputs.image_name }}-
          change-path: images/${{ inputs.image_name }}

  image:
    name: Image
    needs: version
    if: needs.version.outputs.version_type != 'none'
    uses: ./.github/workflows/image.yml
    with:
      image: ${{ inputs.image_name }}
      push: true
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish
    needs: [version, image]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch image
        uses: hononeko/actions/publish-image@v1
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            ${{ needs.version.outputs.version }}
            latest
          expected-digests: "2"
          title: ${{ inputs.image_name }} ${{ needs.version.outputs.version }} published

  release:
    name: GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release notes
        uses: hononeko/actions/release-notes@v1
        with:
          previous-tag: ${{ needs.version.outputs.previous_tag }}
          tag: ${{ needs.version.outputs.version_tag }}
          change-path: images/${{ inputs.image_name }}
          summary: Release notes for ${{ needs.version.outputs.version_tag }}

      # Creates the tag on this commit too.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ needs.version.outputs.version_tag }}
        run: gh release create "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION_TAG" --notes-file release-notes.md
